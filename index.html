<script>
var SB_URL='https://tuzurgxqhcjdnnqydamu.supabase.co';
var SB_KEY='sb_publishable_AYxHoDMEctSuZ1u_hHyALg_bw7TT3mJ';
var sb=supabase.createClient(SB_URL,SB_KEY);
var today=new Date().toISOString().slice(0,10);
var S={user:null,prof:null,courses:[],students:[],teachers:[],tc:[],cur:'',tab:'att',date:today,month:today.slice(0,7),att:{},rep:[],err:'',msg:'',armed:'',alerts:[],alertMap:{},abs:{},showAl:false,ready:false};
var LIMIT=7,alT;
var isA=function(){return S.prof&&S.prof.role=='admin'};
var $=function(id){return document.getElementById(id)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cc(){return S.courses.find(function(c){return c.id==S.cur})}
function fail(r){if(r&&r.error){S.err=r.error.message;return true}return false}

async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){S.user=null;S.ready=true;return render()}
  S.user=s.data.session.user;
  var p=await sb.from('profiles').select('*').eq('id',S.user.id).single();
  S.prof=p.data;
  if(!S.prof){S.err='پڕۆفایلەکەت نەدۆزرایەوە';S.ready=true;return render()}
  await loadBase();await loadAlerts();S.tab=isA()?'att':'rep';await loadTab();S.ready=true;render();
}
async function loadBase(){
  var r=await Promise.all([sb.from('courses').select('*').order('created_at'),sb.from('students').select('*').order('created_at')]);
  fail(r[0]);fail(r[1]);S.courses=r[0].data||[];S.students=r[1].data||[];
  if(!cc())S.cur=S.courses[0]?S.courses[0].id:'';
  if(isA()){var t=await Promise.all([sb.from('profiles').select('*').eq('role','teacher').order('created_at'),sb.from('teacher_courses').select('*')]);S.teachers=t[0].data||[];S.tc=t[1].data||[]}
}
async function loadTab(){
  if(!S.cur)return;
  if(S.tab=='att'){var r=await sb.from('attendance').select('student_id,status').eq('course_id',S.cur).eq('date',S.date);fail(r);S.att={};(r.data||[]).forEach(function(x){S.att[x.student_id]=x.status})}
  if(S.tab=='rep'){S.rep=await fetchAtt(S.cur,S.month)}
}
async function loadAlerts(){
  var rows=[],from=0,ab={};
  for(;;){
    var r=await sb.from('attendance').select('student_id,status').order('id').range(from,from+999);
    if(r.error||!r.data)break;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000;
  }
  rows.forEach(function(x){if(x.status=='a')ab[x.student_id]=(ab[x.student_id]||0)+1});
  S.abs=ab;S.alerts=[];S.alertMap={};
  S.students.forEach(function(s){
    var c=S.courses.find(function(c){return c.id==s.course_id});if(!c)return;
    var tot=+c.total_sessions||43,lim=+c.alert_pct||7,a=ab[s.id]||0,p=Math.round(a/tot*1000)/10;
    if(a>0&&p>=lim){S.alerts.push({name:s.name,course:c.name,cid:c.id,a:a,n:tot,p:p});S.alertMap[s.id]=p}
  });
  S.alerts.sort(function(x,y){return y.p-x.p});
}
function schedAl(){clearTimeout(alT);alT=setTimeout(async function(){await loadAlerts();render()},1500)}
async function fetchAtt(cid,m){
  var p=m.split('-'),last=new Date(+p[0],+p[1],0).getDate(),out=[],from=0;
  for(;;){
    var r=await sb.from('attendance').select('student_id,date,status').eq('course_id',cid).gte('date',m+'-01').lte('date',m+'-'+String(last).padStart(2,'0')).order('id').range(from,from+999);
    if(fail(r))break;out=out.concat(r.data);if(r.data.length<1000)break;from+=1000;
  }
  return out;
}
function calc(cid,rows){
  var sts=S.students.filter(function(s){return s.course_id==cid}),map={},ds=[],cs=S.courses.find(function(c){return c.id==cid}),tot=(cs&&+cs.total_sessions)||43;
  rows.forEach(function(r){map[r.student_id+'|'+r.date]=r.status;if(ds.indexOf(r.date)<0)ds.push(r.date)});ds.sort();
  return{ds:ds,out:sts.map(function(s){var p=0,a=0,e=0,cells=ds.map(function(d){var v=map[s.id+'|'+d];if(v=='p'){p++;return'ئامادە'}if(v=='a'){a++;return'غائیب'}if(v=='e'){e++;return'مۆڵەت'}return''});
    var ya=S.abs[s.id]||0;return{n:s.name,cells:cells,p:p,a:a,e:e,ya:ya,pct:Math.round(ya/tot*1000)/10}})};
}

async function login(){
  var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){S.err=/fetch|network/i.test(r.error.message)?'پەیوەندی بە داتابەیسەوە نەکرا. فایلەکە لەسەر Netlify بکەرەوە، نەک لەناو Claude.':'ئیمەیڵ یان وشەی نهێنی هەڵەیە';render();return}
  S.err='';await boot();
}
async function logout(){await sb.auth.signOut();S.prof=null;S.user=null;S.courses=[];S.students=[];S.err='';render()}
async function setS(sid,v){S.att[sid]=v;render();fail(await sb.from('attendance').upsert({course_id:S.cur,student_id:sid,date:S.date,status:v},{onConflict:'student_id,date'}));if(S.err)render();else schedAl()}
async function allP(){
  var rows=S.students.filter(function(s){return s.course_id==S.cur}).map(function(s){S.att[s.id]='p';return{course_id:S.cur,student_id:s.id,date:S.date,status:'p'}});
  render();if(!rows.length)return;fail(await sb.from('attendance').upsert(rows,{onConflict:'student_id,date'}));if(S.err)render();else schedAl();
}
async function addCourse(){
  var n=$('ncn').value.trim();if(!n)return;
  fail(await sb.from('courses').insert({name:n,day:$('ncd').value.trim(),time:$('nct').value.trim()}));
  await loadBase();render();
}
async function addStudent(cid){
  var el=$('ns_'+cid),n=el.value.trim();if(!n)return;
  fail(await sb.from('students').insert({course_id:cid,name:n}));await loadBase();render();
}
async function exportX(){
  S.msg='تکایە چاوەڕێ بکە...';render();
  var wb=XLSX.utils.book_new(),used={};
  for(var i=0;i<S.courses.length;i++){
    var c=S.courses[i],r=calc(c.id,await fetchAtt(c.id,S.month)),aoa=[['ناوی خوێندکار'].concat(r.ds,['ئامادە (مانگ)','غائیب (مانگ)','مۆڵەت (مانگ)','غیابی ساڵ','ڕێژەی ساڵانە %'])];
    r.out.forEach(function(o){aoa.push([o.n].concat(o.cells,[o.p,o.a,o.e,o.ya,o.pct]))});
    var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:22}];
    var sn=c.name.replace(/[\[\]:*?\/\\]/g,'').slice(0,28)||'sheet';if(used[sn])sn+=' '+(i+1);used[sn]=1;
    XLSX.utils.book_append_sheet(wb,ws,sn);
  }
  wb.Workbook={Views:[{RTL:true}]};
  var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'}),url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');
  a.href=url;a.download='attendance-'+S.month+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},3000);
  S.msg='فایلی Excel داگیرا';render();
}

function empty(x){return '<div class="empty">'+x+'</div>'}
function vLogin(){
  return themeBtn('theme-fl')+'<div class="login"><img src="icon-192.png" alt=""><h1>غیاباتی خوێندکاران</h1><p class="sub">بۆ بەردەوامبوون بچۆ ژوورەوە</p>'+(S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
  '<input id="em" type="email" placeholder="ئیمەیڵ" autocomplete="username" dir="ltr"><input id="pw" type="password" placeholder="وشەی نهێنی" autocomplete="current-password" dir="ltr"><button class="all" data-a="login">چوونەژوورەوە</button></div>';
}
function vAtt(c){
  var sts=S.students.filter(function(s){return s.course_id==c.id}),np=0,na=0,ne=0;
  sts.forEach(function(s){var v=S.att[s.id];if(v=='p')np++;if(v=='a')na++;if(v=='e')ne++});
  var h='<div class="bar"><input type="date" id="dt" value="'+S.date+'" aria-label="ڕێکەوت"><button class="all" data-a="allp">هەمووی ئامادە</button></div>'+
    '<div class="stats"><div class="stat ok"><b>'+np+'</b><span>ئامادە</span></div><div class="stat bad"><b>'+na+'</b><span>غائیب</span></div><div class="stat warn"><b>'+ne+'</b><span>مۆڵەت</span></div></div>';
  if(!sts.length)h+=empty('ئەم وانەیە خوێندکاری نییە. لە «وانەکان» زیادیان بکە.');
  sts.forEach(function(s){var v=S.att[s.id];
    h+='<div class="row st"><div class="who"><span class="av" style="background:hsl('+hue(s.name)+' 55% 42%)">'+esc(String(s.name).trim().charAt(0))+'</span><div class="nm">'+esc(s.name)+(S.alertMap[s.id]!=null?' <span class="pill warn">⚠ '+S.alertMap[s.id]+'%</span>':'')+'</div></div><div class="btns">'+
    [['p','ئامادە'],['a','غائیب'],['e','مۆڵەت']].map(function(t){return '<button class="'+t[0]+(v==t[0]?' on':'')+'" data-a="st" data-i="'+s.id+'" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div></div>'});
  return h;
}
function vRep(c){
  var r=calc(c.id,S.rep),al=+c.alert_pct||7,nst=S.students.filter(function(s){return s.course_id==c.id}).length,nal=S.alerts.filter(function(x){return x.cid==c.id}).length;
  var h='<div class="bar"><input type="month" id="mo" value="'+S.month+'" aria-label="مانگ"><button class="all" data-a="xl">داگرتنی Excel</button></div>'+(S.msg?'<p class="sub">'+esc(S.msg)+'</p>':'')+
    '<div class="stats"><div class="stat pri"><b>'+nst+'</b><span>خوێندکار</span></div><div class="stat"><b>'+r.ds.length+'</b><span>وانەی ئەم مانگە</span></div><div class="stat '+(nal?'bad':'ok')+'"><b>'+nal+'</b><span>ئاگادارکردنەوە</span></div></div>';
  if(!r.ds.length)return h+empty('لەم مانگەدا غیاب تۆمار نەکراوە.');
  return h+'<div class="scroll"><table class="rep"><tr><th>خوێندکار</th><th>ئامادە</th><th>غائیب</th><th>مۆڵەت</th><th>غیابی ساڵ</th></tr>'+
    r.out.map(function(x){var k=x.pct>=al*2?'bad':x.pct>=al?'warn':'ok';return '<tr><td>'+esc(x.n)+'</td><td>'+x.p+'</td><td>'+x.a+'</td><td>'+x.e+'</td><td><span class="pill '+k+'">'+x.ya+' · '+x.pct+'%</span></td></tr>'}).join('')+'</table></div>'+
    '<p class="note">ئامادە و غائیب و مۆڵەت هی ئەم مانگەن. «غیابی ساڵ» کۆی غیابی ساڵەکەیە و ڕێژەکەی لە ژمارەی گشتی وانەکانی ساڵ حیساب دەکرێت (لە ڕێکخستن دەگۆڕدرێت).</p><p class="note">فایلی Excel هەموو وانەکانت لەخۆ دەگرێت، هەر وانەیەک لە شیتێکی جیا.</p>';
}
function vCourses(){
  var h=S.msg?'<p class="sub">'+esc(S.msg)+'</p>':'';
  S.courses.forEach(function(x){
    h+='<div class="row"><div class="g3"><input data-cf="name" data-id="'+x.id+'" value="'+esc(x.name)+'" aria-label="ناوی وانە"><input data-cf="day" data-id="'+x.id+'" value="'+esc(x.day)+'" aria-label="ڕۆژ"><input data-cf="time" data-id="'+x.id+'" value="'+esc(x.time)+'" aria-label="کات"></div><div>'+
    S.students.filter(function(s){return s.course_id==x.id}).map(function(s){return '<span class="chip">'+esc(s.name)+'<button data-a="delst" data-id="'+s.id+'" aria-label="سڕینەوە">×</button></span>'}).join('')+'</div>'+
    '<div class="add"><input id="ns_'+x.id+'" placeholder="ناوی خوێندکاری نوێ"><button class="all" data-a="addst" data-id="'+x.id+'">زیادکردن</button></div>'+
    '<div style="margin-top:8px"><label class="ghost" style="cursor:pointer;display:inline-block">ئەپلۆدی ناوەکان لە Excel<input type="file" accept=".xlsx,.xls,.csv" data-imp="'+x.id+'" hidden></label></div>'+
    '<button class="danger" data-a="delc" data-id="'+x.id+'">'+(S.armed==x.id?'دڵنیایت؟ هەموو خوێندکار و غیابەکانیشی دەسڕێنەوە. دووبارە کلیک بکە':'سڕینەوەی وانە')+'</button></div>';
  });
  return h+'<div class="row"><div class="nm">وانەی نوێ</div><div class="g3"><input id="ncn" placeholder="ناوی وانە"><input id="ncd" placeholder="ڕۆژ"><input id="nct" placeholder="کات"></div><button class="all" data-a="addc">زیادکردنی وانە</button></div>';
}
function vTeachers(){
  if(!S.teachers.length)return '<div class="empty">هێشتا هیچ مامۆستایەک نییە. لە Supabase بچۆ بۆ Authentication ← Users ← Add user و ئەکاونتی مامۆستا دروست بکە، پاشان لێرە دەرکەوێت و وانەکانی دیاری بکە.</div>';
  return S.teachers.map(function(t){
    return '<div class="row"><div class="nm">'+esc(t.email)+'</div><input data-tn="'+t.id+'" value="'+esc(t.full_name||'')+'" placeholder="ناوی مامۆستا" style="width:100%;margin-bottom:8px"><div>'+
    S.courses.map(function(c){var on=S.tc.some(function(k){return k.teacher_id==t.id&&k.course_id==c.id});return '<label class="chk"><input type="checkbox" data-tc="'+t.id+'|'+c.id+'"'+(on?' checked':'')+'>'+esc(c.name)+'</label>'}).join('')+'</div></div>';
  }).join('');
}
function minAbs(c){var t=+c.total_sessions||43,al=+c.alert_pct||7;for(var k=1;k<=t;k++){if(Math.round(k/t*1000)/10>=al)return k}return t}
function vSettings(){
  var h='<p class="note" style="margin:0 2px 12px">ڕێژەی غیاب = ژمارەی غیابی ساڵ ÷ ژمارەی گشتی وانەکانی ساڵ. بۆ نموونە لە ٤٣ وانە، ٣ غیاب نزیکەی ٧٪ دەکات.</p>';
  if(!S.courses.length)return h+'<p class="sub">هیچ وانەیەک نییە.</p>';
  S.courses.forEach(function(x){
    h+='<div class="row"><div class="nm">'+esc(x.name)+'</div><div class="g2"><label>ژمارەی گشتی وانەکانی ساڵ<input type="number" min="1" data-sf="total_sessions" data-id="'+x.id+'" value="'+(+x.total_sessions||43)+'"></label>'+
    '<label>ڕێژەی ئاگادارکردنەوە (%)<input type="number" min="1" max="100" step="0.5" data-sf="alert_pct" data-id="'+x.id+'" value="'+(+x.alert_pct||7)+'"></label></div>'+
    '<p class="sub" style="margin:8px 0 0">ئاگادارکردنەوە دوای <b>'+minAbs(x)+'</b> غیاب دەردەکەوێت.</p></div>';
  });
  return h;
}
async function importXls(cid,file){
  if(!file)return;
  S.msg='تکایە چاوەڕێ بکە...';render();
  try{
    var wb=XLSX.read(await file.arrayBuffer(),{type:'array',codepage:65001}),aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
    var num=aoa.length>1&&aoa.slice(1).every(function(r){return /^\d+$/.test(String(r[0]==null?'':r[0]))}),col=num?1:0;
    var names=aoa.map(function(r){return String(r&&r[col]!=null?r[col]:'').trim()}).filter(Boolean);
    if(names.length&&/^(ناو|name)/i.test(names[0]))names.shift();
    var have={},seen={},rows=[];
    S.students.filter(function(s){return s.course_id==cid}).forEach(function(s){have[s.name]=1});
    names.forEach(function(n){if(!have[n]&&!seen[n]){seen[n]=1;rows.push({course_id:cid,name:n})}});
    if(!rows.length){S.msg='هیچ ناوێکی نوێ نەدۆزرایەوە';return render()}
    if(fail(await sb.from('students').insert(rows))){S.msg='';return render()}
    await loadBase();await loadAlerts();S.msg=rows.length+' خوێندکار زیادکران';
  }catch(e){S.msg='فایلەکە نەخوێندرایەوە. دڵنیابە Excel یان CSV ـە'}
  render();
}
function vAlerts(){
  if(!S.alerts.length)return '';
  var h='<div class="alert"><div class="ah"><b>⚠ '+S.alerts.length+' خوێندکار گەیشتوونەتە ئاستی ئاگادارکردنەوەی غیاب</b><button class="ghost" data-a="al">'+(S.showAl?'شاردنەوە':'پیشاندان')+'</button></div>';
  if(S.showAl)h+=S.alerts.map(function(x){return '<div class="li"><span>'+esc(x.name)+' <small>· '+esc(x.course)+'</small></span><span>'+x.a+' غیاب لە '+x.n+' وانەی ساڵ · <b>'+x.p+'%</b></span></div>'}).join('');
  return h+'</div>';
}
function render(){
  var app=$('app'),bar=$('bar'),nav=$('nav');
  document.body.className=S.prof?'':'auth';
  if(!S.ready){bar.innerHTML='';nav.innerHTML='';app.innerHTML='<p class="sub" style="text-align:center;margin-top:30vh;color:#fff">چاوەڕێ بکە...</p>';return}
  if(!S.prof){bar.innerHTML='';nav.innerHTML='';app.innerHTML=vLogin()+'<div style="max-width:380px;margin:16px auto 0">'+vInstall()+'</div>';return}
  var TT={att:'تۆمارکردنی غیاب',rep:'ڕاپۆرت',crs:'وانە و خوێندکاران',set:'ڕێکخستن',tch:'مامۆستاکان'};
  var tabs=isA()?[['att','تۆمارکردن'],['rep','ڕاپۆرت'],['crs','وانەکان'],['set','ڕێکخستن'],['tch','مامۆستا']]:[['rep','ڕاپۆرت']];
  bar.innerHTML='<div class="appbar"><div class="brand"><img src="icon-192.png" alt=""><div><h1>غیاباتی خوێندکاران</h1><span>'+esc(S.prof.full_name||S.prof.email)+' · '+(isA()?'ئەدمین':'مامۆستا')+'</span></div></div><div class="acts">'+themeBtn()+'<button class="ico" data-a="out" aria-label="دەرچوون">'+svg(ICON.out)+'</button></div></div>';
  nav.innerHTML=tabs.length>1?'<div class="bnav">'+tabs.map(function(x){return '<button class="'+(S.tab==x[0]?'on':'')+'" data-a="tab" data-id="'+x[0]+'"><i>'+svg(ICON[x[0]])+'</i>'+x[1]+'</button>'}).join('')+'</div>':'';
  var c=cc(),pick=(S.tab=='att'||S.tab=='rep'),h='<h2 class="ptitle">'+TT[S.tab]+'</h2>';
  h+=vInstall();
  if(S.err)h+='<div class="err">'+esc(S.err)+'</div>';
  if(pick)h+=vAlerts()+'<div class="courses">'+S.courses.map(function(x){return '<button class="course'+(x.id==S.cur?' on':'')+'" data-a="course" data-id="'+x.id+'"><b>'+esc(x.name)+'</b><span>'+esc(x.day)+' · '+esc(x.time)+'</span></button>'}).join('')+'</div>';
  if(S.tab=='crs')h+=vCourses();
  else if(S.tab=='set')h+=vSettings();
  else if(S.tab=='tch')h+=vTeachers();
  else if(!c)h+=empty(isA()?'هیچ وانەیەک نییە. لە «وانەکان» زیادی بکە.':'هێشتا هیچ وانەیەکت پێ نەدراوە. پەیوەندی بە بەڕێوەبەر بکە.');
  else h+=S.tab=='att'?vAtt(c):vRep(c);
  app.innerHTML=h;
}

document.addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b||!b.dataset.a)return;var a=b.dataset.a,id=b.dataset.id;S.err='';
  if(a=='install'&&DP){DP.prompt();await DP.userChoice;DP=null;return render()}
  if(a=='theme')return toggleTheme();
  if(a=='login')return login();
  if(a=='out')return logout();
  if(a=='tab'){S.tab=id;S.armed='';S.msg='';await loadTab();await loadAlerts();return render()}
  if(a=='al'){S.showAl=!S.showAl;return render()}
  if(a=='course'){S.cur=id;S.msg='';await loadTab();return render()}
  if(a=='st')return setS(b.dataset.i,b.dataset.v);
  if(a=='allp')return allP();
  if(a=='xl')return exportX();
  if(a=='addc')return addCourse();
  if(a=='addst')return addStudent(id);
  if(a=='delst'){fail(await sb.from('students').delete().eq('id',id));await loadBase();return render()}
  if(a=='delc'){if(S.armed!=id){S.armed=id;return render()}S.armed='';fail(await sb.from('courses').delete().eq('id',id));await loadBase();return render()}
});
document.addEventListener('keydown',function(e){if(e.key=='Enter'&&e.target.id=='pw')login()});
document.addEventListener('change',async function(e){
  var t=e.target,d=t.dataset;
  if(t.id=='dt'&&t.value){S.date=t.value;await loadTab();return render()}
  if(t.id=='mo'&&t.value){S.month=t.value;S.msg='';await loadTab();return render()}
  if(d.imp){var f=t.files[0];t.value='';return importXls(d.imp,f)}
  if(d.sf){var u2={};u2[d.sf]=+t.value;if(!(u2[d.sf]>0))return render();fail(await sb.from('courses').update(u2).eq('id',d.id));await loadBase();await loadAlerts();return render()}
  if(d.cf){var u={};u[d.cf]=t.value.trim();fail(await sb.from('courses').update(u).eq('id',d.id));await loadBase();return render()}
  if(d.tn){fail(await sb.from('profiles').update({full_name:t.value.trim()}).eq('id',d.tn));await loadBase();return render()}
  if(d.tc){var p=d.tc.split('|');
    if(t.checked)fail(await sb.from('teacher_courses').insert({teacher_id:p[0],course_id:p[1]}));
    else fail(await sb.from('teacher_courses').delete().eq('teacher_id',p[0]).eq('course_id',p[1]));
    await loadBase();render();
  }
});
boot();
</script>
</body>
</html>
